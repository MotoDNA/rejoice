<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 임원 선거 · 리조이스</title>
<meta name="theme-color" content="#fbfbfd">
<meta property="og:title" content="2027 임원 선거 · 리조이스">
<meta property="og:description" content="총무와 회계를 선택해 주세요">
<style>
:root{
  --bg:#fbfbfd; --surface:#ffffff; --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
  --line:#d2d2d7; --line-soft:#e8e8ed; --blue:#0071e3; --blue-hover:#0077ed;
  --blue-soft:#f0f7ff; --green:#1d9f5f; --red:#d7262c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro KR","SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-size:17px;line-height:1.5;letter-spacing:-.015em;-webkit-font-smoothing:antialiased}
.wrap{max-width:692px;margin:0 auto;padding:0 22px 96px}
header{text-align:center;padding:72px 0 44px}
.eyebrow{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;margin:0 0 10px}
h1{margin:0;font-size:clamp(38px,9vw,56px);line-height:1.07;font-weight:700;letter-spacing:-.025em}
.sub{margin:16px auto 0;max-width:460px;font-size:19px;color:var(--ink-2);line-height:1.47}
.card{background:var(--surface);border-radius:18px;padding:28px 24px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05)}
.card + .card{margin-top:18px}
h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.hint{margin:0;font-size:15px;color:var(--ink-2)}
.hidden{display:none !important}
.field{margin-top:20px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
input[type=text],input[type=password]{width:100%;padding:14px 16px;font:inherit;font-size:17px;
  color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;
  transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
input::placeholder{color:#b0b0b5}
.pw{letter-spacing:.35em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;
  font:inherit;font-size:17px;font-weight:500;letter-spacing:-.01em;color:#fff;background:var(--blue);
  border:none;border-radius:980px;cursor:pointer;transition:background .15s,transform .08s}
.btn:hover{background:var(--blue-hover)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn.wide{width:100%;margin-top:24px}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.ghost:hover{background:#f5f5f7}
.linkbtn{background:none;border:none;padding:4px 2px;cursor:pointer;font:inherit;font-size:15px;color:var(--blue)}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.post{margin-top:10px}
.post-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.post-head h2{font-size:22px}
.counter{font-size:14px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.counter.full{color:var(--blue)}
.cands{display:grid;gap:10px}
.cand{display:flex;align-items:center;gap:14px;padding:16px 18px;background:#fff;
  border:1px solid var(--line-soft);border-radius:14px;cursor:pointer;
  transition:border-color .15s,background .15s,box-shadow .15s;user-select:none}
.cand:hover{border-color:var(--line)}
.cand .tick{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.cand .tick svg{width:13px;height:13px;opacity:0;transition:opacity .12s}
.cand .nm{font-size:18px;font-weight:500;letter-spacing:-.01em}
.cand[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px var(--blue) inset}
.cand[aria-pressed=true] .tick{background:var(--blue);border-color:var(--blue)}
.cand[aria-pressed=true] .tick svg{opacity:1}
.cand.locked{opacity:.4;cursor:default}
.note{margin-top:22px;padding:14px 16px;background:#f5f5f7;border-radius:12px;
  font-size:14px;color:var(--ink-2);line-height:1.55}
.msg{margin-top:14px;font-size:15px;min-height:22px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.done-mark{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;background:var(--green);
  display:flex;align-items:center;justify-content:center}
.done-mark svg{width:26px;height:26px}
.summary{margin-top:24px;border-top:1px solid var(--line-soft)}
.srow{display:flex;justify-content:space-between;gap:16px;padding:15px 2px;border-bottom:1px solid var(--line-soft)}
.srow dt{margin:0;font-size:15px;color:var(--ink-2)}
.srow dd{margin:0;font-size:17px;font-weight:500;text-align:right}
.center{text-align:center}
.bar{margin-top:14px}
.bar-top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.bar-top b{font-weight:600}
.bar-top span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.rsec + .rsec{margin-top:30px}
footer{text-align:center;padding:16px 0 0;font-size:13px;color:var(--ink-3);line-height:2}
footer a{color:var(--ink-3)}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">리조이스</p>
    <h1>2027 임원 선거</h1>
    <p class="sub">총무와 회계를 맡아주실 분을 선택해 주세요.<br>각 항목마다 두 분까지 고를 수 있습니다.</p>
  </header>

  <section id="login" class="card">
    <h2>시작하기</h2>
    <p class="hint">이름과 비밀번호 네 자리를 입력해 주세요. 같은 정보로 다시 들어오면 투표를 수정할 수 있습니다.</p>
    <div class="field">
      <label for="vName">이름</label>
      <input type="text" id="vName" maxlength="4" placeholder="홍길동" autocomplete="off" autocapitalize="off">
    </div>
    <div class="field">
      <label for="vPw">비밀번호 (숫자 4자리)</label>
      <input type="password" id="vPw" class="pw" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    </div>
    <button class="btn wide" id="loginBtn">입장</button>
    <div class="msg" id="loginMsg"></div>
    <div class="note">비밀번호는 본인 확인용입니다. 누가 누구를 뽑았는지는 저장되지 않습니다.</div>
  </section>

  <section id="ballot" class="hidden">
    <div class="card post">
      <div class="post-head"><h2>총무</h2><span class="counter" id="cntA">0 / 2</span></div>
      <div class="cands" id="listA"></div>
    </div>
    <div class="card post">
      <div class="post-head"><h2>회계</h2><span class="counter" id="cntB">0 / 2</span></div>
      <div class="cands" id="listB"></div>
    </div>
    <div class="card">
      <button class="btn wide" id="submitBtn">투표 제출</button>
      <div class="msg" id="voteMsg"></div>
      <div class="note">제출 후에도 같은 이름과 비밀번호로 다시 들어와 수정할 수 있습니다. 투표는 익명으로 집계됩니다.</div>
      <p class="center" style="margin:18px 0 0"><button class="linkbtn" id="logoutBtn">다른 사람으로 투표하기</button></p>
    </div>
  </section>

  <section id="done" class="card hidden">
    <div class="done-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>
    <h2 class="center">투표가 완료되었습니다</h2>
    <p class="hint center" id="doneWho"></p>
    <dl class="summary" id="doneList"></dl>
    <button class="btn ghost wide" id="editBtn">선택 수정하기</button>
    <p class="center" style="margin:18px 0 0"><button class="linkbtn" id="logoutBtn2">다른 사람으로 투표하기</button></p>
  </section>

  <section id="result" class="card hidden">
    <h2>집계 결과</h2>
    <p class="hint" id="resultMeta"></p>
    <div id="resultBody"></div>
  </section>

  <footer>
    <button class="linkbtn" id="resultBtn">결과 보기</button><br>
    <a href="./">감사 챌린지 페이지로</a>
  </footer>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby2jMn8lBH8RcxU5OCENgL6j5WIu5mpCdxYLUeeHXIeYjukduEe9r0mQnQwOdrWj18e/exec';
const CANDIDATES = ['배우리','이준호','장민','최진솔','최환준'];
const MAX_PICK = 2;

let me = null;
let picks = { a: [], b: [] };
let adminCode = '';

async function api(payload){
  const r = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if(!j.ok && j.error) throw new Error(j.error);
  return j;
}

const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(id,on){ $(id).classList.toggle('hidden', !on) }
function say(el,text,kind){ const e=$(el); e.textContent=text||''; e.className='msg'+(kind?' '+kind:'') }

const TICK = '<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></span>';

function renderList(key){
  const el = key==='a' ? $('listA') : $('listB');
  el.innerHTML = CANDIDATES.map(n=>{
    const on = picks[key].includes(n);
    const full = picks[key].length >= MAX_PICK && !on;
    return '<div class="cand'+(full?' locked':'')+'" role="button" tabindex="0" aria-pressed="'+on+'" data-post="'+key+'" data-name="'+esc(n)+'">'+TICK+'<span class="nm">'+esc(n)+'</span></div>';
  }).join('');
  const c = key==='a' ? $('cntA') : $('cntB');
  c.textContent = picks[key].length + ' / ' + MAX_PICK;
  c.classList.toggle('full', picks[key].length >= MAX_PICK);
}
function renderBallot(){ renderList('a'); renderList('b') }

function toggle(key,name){
  const i = picks[key].indexOf(name);
  if(i >= 0) picks[key].splice(i,1);
  else { if(picks[key].length >= MAX_PICK) return; picks[key].push(name) }
  renderList(key);
  say('voteMsg','');
}

document.addEventListener('click', e=>{
  const c = e.target.closest('.cand');
  if(c && !c.classList.contains('locked')) toggle(c.dataset.post, c.dataset.name);
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const c = e.target.closest('.cand');
  if(c && !c.classList.contains('locked')){ e.preventDefault(); toggle(c.dataset.post, c.dataset.name) }
});

$('loginBtn').onclick = async ()=>{
  const name = $('vName').value.trim();
  const pw   = $('vPw').value.trim();
  if(name.length < 2){ say('loginMsg','이름을 정확히 입력해 주세요','err'); return }
  if(!/^\d{4}$/.test(pw)){ say('loginMsg','비밀번호는 숫자 네 자리입니다','err'); return }
  $('loginBtn').disabled = true; say('loginMsg','확인하는 중...');
  try{
    const j = await api({action:'vote_get', name, pw});
    me = {name, pw};
    try{ localStorage.setItem('rejoiceVoter', JSON.stringify(me)) }catch(e){}
    picks = { a: j.a || [], b: j.b || [] };
    say('loginMsg','');
    if(j.voted) showDone(); else showBallot();
  }catch(err){ say('loginMsg', err.message, 'err') }
  $('loginBtn').disabled = false;
};

function showBallot(){
  renderBallot();
  show('login',false); show('done',false); show('ballot',true);
  window.scrollTo({top:0,behavior:'smooth'});
}

function showDone(){
  $('doneWho').textContent = me ? me.name + ' 님의 선택' : '';
  $('doneList').innerHTML =
    '<div class="srow"><dt>총무</dt><dd>'+(picks.a.length?picks.a.map(esc).join(', '):'선택 안 함')+'</dd></div>'+
    '<div class="srow"><dt>회계</dt><dd>'+(picks.b.length?picks.b.map(esc).join(', '):'선택 안 함')+'</dd></div>';
  show('login',false); show('ballot',false); show('done',true);
  window.scrollTo({top:0,behavior:'smooth'});
}

$('editBtn').onclick = showBallot;

$('submitBtn').onclick = async ()=>{
  if(!me) return;
  if(!picks.a.length && !picks.b.length){ say('voteMsg','한 명 이상 선택해 주세요','err'); return }
  $('submitBtn').disabled = true; say('voteMsg','저장하는 중...');
  try{
    await api({action:'vote_set', name:me.name, pw:me.pw, a:picks.a, b:picks.b});
    say('voteMsg','');
    showDone();
  }catch(err){ say('voteMsg','저장 실패: '+err.message,'err') }
  $('submitBtn').disabled = false;
};

function logout(){
  me = null; picks = {a:[],b:[]};
  try{ localStorage.removeItem('rejoiceVoter') }catch(e){}
  $('vName').value=''; $('vPw').value='';
  show('ballot',false); show('done',false); show('result',false); show('login',true);
  window.scrollTo({top:0,behavior:'smooth'});
}
$('logoutBtn').onclick = logout;
$('logoutBtn2').onclick = logout;

function renderResult(j){
  const block = (title, counts) => {
    const max = Math.max(1, ...CANDIDATES.map(n=>counts[n]||0));
    return '<div class="rsec"><h2 style="font-size:19px">'+title+'</h2>' +
      CANDIDATES.map(n=>{
        const v = counts[n] || 0;
        return '<div class="bar"><div class="bar-top"><b>'+esc(n)+'</b><span>'+v+'표</span></div>'+
               '<div class="track"><i style="width:'+Math.round(v/max*100)+'%"></i></div></div>';
      }).join('') + '</div>';
  };
  $('resultMeta').textContent = '투표에 참여한 사람 ' + (j.voters||0) + '명';
  $('resultBody').innerHTML = block('총무', j.a||{}) + block('회계', j.b||{});
  show('result',true);
  $('result').scrollIntoView({behavior:'smooth'});
}

$('resultBtn').onclick = async ()=>{
  try{
    const j = await api({action:'vote_result', code: adminCode});
    renderResult(j);
  }catch(err){
    const c = prompt('아직 결과가 공개되지 않았습니다.\n임원진 코드를 입력하면 확인할 수 있습니다.');
    if(c === null) return;
    try{
      const j = await api({action:'vote_result', code:c});
      adminCode = c;
      renderResult(j);
    }catch(e2){ alert(e2.message) }
  }
};

(function init(){
  try{
    const saved = JSON.parse(localStorage.getItem('rejoiceVoter') || 'null');
    if(saved && saved.name && saved.pw){ $('vName').value = saved.name; $('vPw').value = saved.pw }
  }catch(e){}
})();
</script>
</body>
</html>
